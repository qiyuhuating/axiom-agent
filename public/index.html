<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axiom Agent</title><link rel="stylesheet" href="/dsh-ui.css"><link rel="stylesheet" href="/workbench.css"><link rel="stylesheet" href="/style.css"></head>
<body><aside><div class="brand"><span class="mark">A</span><div>Axiom <small>ENGINEERING AGENT</small></div></div><button id="new" class="new">＋ 新建会话</button><label>会话历史</label><nav id="sessions"></nav><footer>本地工作台 · Pi 1.5.2</footer></aside>
<main><header><div><strong>工作区</strong><span id="workspace">连接中</span></div><div class="controls"><button id="show-workbench" type="button" title="显示工作台">工作台</button><button id="session-actions" type="button" title="Native Pi session actions">Pi</button><select id="models" aria-label="模型"></select><select id="levels" aria-label="推理强度"></select><span id="status" role="status">连接中</span></div></header>
<section id="transcript" aria-live="polite"><div class="welcome"><h1>今天构建什么？</h1><p>分析代码、实现功能、验证工程，或处理通用任务。</p></div></section>
<div class="composer"><div id="error" role="alert"></div><form id="form"><div id="attachment-list"></div><textarea id="prompt" rows="3" placeholder="描述任务，或提出问题…" aria-label="任务输入"></textarea><div class="actions"><span>Ctrl + Enter 发送</span><input type="file" id="attach-input" multiple hidden><button type="button" id="attach-button" title="添加附件">附件</button><select id="queue-mode" aria-label="Message queue"><option value="steer">Steer</option><option value="followUp">Follow-up</option></select><button id="stop" type="button" disabled>停止</button><button id="send" type="submit" class="primary">发送 ↗</button></div></form><small>Agent 在当前工作区以本机用户身份执行工具。只对可信任务授权。</small></div></main>
<aside class="inspector"><div id="workbench"></div><div class="trace-panel"><h2 id="trace-heading">执行轨迹</h2><div id="trace"></div></div></aside><div id="dialog-root"></div><div id="wb-notice" role="status" hidden></div><script type="module" src="/app.js"></script></body></html>
