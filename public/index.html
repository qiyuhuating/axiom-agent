<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axiom Agent</title><link rel="stylesheet" href="/dsh-ui.css"><link rel="stylesheet" href="/workbench.css"><link rel="stylesheet" href="/style.css"></head>
<body><aside class="sidebar"><div class="brand"><span class="mark">A</span><div class="brand-name">Axiom Agent</div><button id="sidebar-toggle" title="收起侧栏" aria-label="收起侧栏"></button></div><div id="new-session-row"><button id="new" class="new" aria-label="新建会话">＋ 新建会话</button></div><nav id="sidebar-panels" aria-label="工作台页面"></nav><nav id="sessions"></nav><footer><button id="sidebar-settings" title="设置" aria-label="设置"></button><button id="theme-toggle" title="切换外观" aria-label="切换外观"></button> 本地工作台 · Pi 1.5.2</footer></aside>
<main><header><button id="sidebar-open" title="展开侧栏" aria-label="展开侧栏"></button><div class="header-title"><strong>工作区</strong><span id="workspace">连接中</span></div><div class="controls"><button id="show-workbench" aria-expanded="false" type="button" title="显示工作台">工作台</button><button id="session-actions" type="button" title="Native Pi session actions">Pi</button><span id="status" role="status">连接中</span></div></header>
<section id="transcript" aria-live="polite"><div class="welcome"><h1>今天构建什么？</h1><p>分析代码、实现功能、验证工程，或处理通用任务。</p></div></section>
<div class="composer"><div id="error" role="alert"></div><form id="form"><div id="attachment-list"></div><textarea id="prompt" rows="3" placeholder="描述任务，或提出问题…" aria-label="任务输入"></textarea><div class="actions"><input type="file" id="attach-input" multiple hidden><button type="button" id="attach-button" aria-label="添加附件" title="添加附件">附件</button><select id="models" aria-label="模型"></select><select id="levels" aria-label="推理强度"></select><select id="queue-mode" aria-label="Message queue"><option value="steer">Steer</option><option value="followUp">Follow-up</option></select><span class="action-spacer"></span><button id="stop" aria-label="停止" title="停止" type="button" disabled>停止</button><button id="send" aria-label="发送" title="发送 (Ctrl+Enter)" type="submit" class="primary">发送 ↗</button></div></form><small>Agent 在当前工作区以本机用户身份执行工具。只对可信任务授权。</small></div></main>
<aside class="inspector"><div id="workbench"></div><div class="trace-panel"><h2 id="trace-heading">执行轨迹</h2><div id="trace"></div></div></aside><div id="dialog-root"></div><div id="wb-notice" role="status" hidden></div><script type="module" src="/app.js"></script></body></html>
