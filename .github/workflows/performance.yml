name: Performance baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: cargo test --locked --manifest-path daemon/Cargo.toml
      - run: npm run prepare:desktop
      - run: node benchmarks/http.mjs
      - run: cargo bench --locked --manifest-path benchmarks/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: performance-baseline
          path: |
            benchmarks/results/http.json
            benchmarks/target/criterion/
          if-no-files-found: error
