name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build:ui
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run test:coverage
      - name: Verify native daemon contracts
        run: cargo test --locked --manifest-path daemon/Cargo.toml
      - name: Build Windows x64 NSIS installer
        run: npm run desktop:build
      - name: Desktop startup log regression
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --bin axiom-desktop concurrent_log_records_preserve_stdout_readiness
      - run: node scripts/check-desktop-runtime.mjs
      - name: Native terminal migration parity
        shell: pwsh
        run: |
          $env:AXIOM_TEST_DAEMON = (Resolve-Path .desktop-runtime/bin/axiom-daemon.exe).Path
          $env:AXIOM_TEST_RUNTIME_ROOT = (Resolve-Path .desktop-runtime).Path
          & .desktop-runtime/bin/node.exe --test scripts/check-terminal-parity.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rust HTTP ingress parity
        shell: pwsh
        run: |
          $env:AXIOM_TEST_GATEWAY = (Resolve-Path .desktop-runtime/bin/axiom-daemon.exe).Path
          $env:AXIOM_TEST_RUNTIME_ROOT = (Resolve-Path .desktop-runtime).Path
          $env:AXIOM_TEST_DAEMON = $env:AXIOM_TEST_GATEWAY
          & .desktop-runtime/bin/node.exe --test --test-name-pattern "HTTP host" test/core-integration.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .desktop-runtime/bin/node.exe --test --test-name-pattern "workbench routes" scripts/check-terminal-parity.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer and generate checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis -File -Filter '*.exe')
          if ($installers.Count -eq 0) { throw 'No NSIS installer was produced' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $checksums = foreach ($installer in $installers) {
            Copy-Item -LiteralPath $installer.FullName -Destination dist
            $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$($installer.Name): $($installer.Length) bytes"
            "$hash  $($installer.Name)"
          }
          $checksums | Set-Content dist/SHA256SUMS.txt -Encoding utf8
      - name: Smoke test the installed Windows desktop
        shell: pwsh
        timeout-minutes: 8
        run: |
          # WebView2 ignores CDP arguments on elevated hosts (wry#1782).
          winget install --id gerardog.gsudo --exact --version 2.6.1 --silent --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:Path += ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          npm install --prefix "$env:RUNNER_TEMP/axiom-smoke" --no-save --no-package-lock playwright@1.58.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:AXIOM_TEST_PLAYWRIGHT_MODULE = Join-Path $env:RUNNER_TEMP 'axiom-smoke/node_modules/playwright/index.mjs'
          gsudo --integrity Medium pwsh -NoProfile -File ./scripts/check-installed-desktop.ps1
          exit $LASTEXITCODE
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: axiom-windows-x64-nsis
          path: dist/
          if-no-files-found: error
